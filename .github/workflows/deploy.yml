name: Deploy

# Деплой на VPS по кнопке. Dev не деплоится через CI: локально хватает
# docker compose (infra/docker-compose.dev.yml) или ./infra/prod-up.sh.
#
# Порядок: SSH → зависимости (ставятся, только если чего-то нет) → git login/pull →
# up --wait → smoke → запись тегов; при провале smoke — откат на предыдущий тег.
#
# Требуется Environment `production` с обязательным подтверждением.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Короткий git sha для деплоя (по умолчанию — SHA запуска)
        type: string
        required: false
      path:
        description: Каталог с clone репозитория на сервере
        type: string
        default: /opt/memorandum

concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: deploy-vps
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production

    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      GHCR_USER: ${{ secrets.GHCR_USER }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      DEPLOY_PATH: ${{ inputs.path }}
      EXPECT_SHA: ${{ inputs.sha }}

    steps:
      - name: Проверка доступности сервера
        id: probe
        run: |
          set -euo pipefail

          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$SSH_KEY" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "**SKIPPED** — не заданы секреты DEPLOY_HOST / DEPLOY_USER / SSH_KEY" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          if ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=5 \
                 -o StrictHostKeyChecking=accept-new \
                 "$DEPLOY_USER@$DEPLOY_HOST" 'true' >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "**SKIPPED (offline)** — $DEPLOY_USER@$DEPLOY_HOST не отвечает по SSH за 5 с" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Деплой
        if: steps.probe.outputs.available == 'true'
        run: |
          set -euo pipefail

          # один и тот же sha идёт и в тег образа, и в git reset — иначе на сервере
          # окажется старый образ с новыми файлами
          rev="$(printf '%s' "${EXPECT_SHA:-$GITHUB_SHA}" | cut -c1-12)"

          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=10 \
              -o StrictHostKeyChecking=accept-new \
              "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' -- \
              "$DEPLOY_PATH" "$rev" "$GHCR_USER" "$GHCR_TOKEN" <<'REMOTE'
          set -eu

          DEPLOY_PATH="$1"
          REV="$2"
          GHCR_USER="${3:-}"
          GHCR_TOKEN="${4:-}"

          TAG="sha-$(printf '%s' "$REV" | cut -c1-7)"

          # ── права: sudo нужен только если чего-то не хватает ──────────────
          SUDO=""
          [ "$(id -u)" -eq 0 ] || SUDO="sudo -n"

          missing=""
          for c in git curl; do
            command -v "$c" >/dev/null 2>&1 || missing="$missing $c"
          done
          command -v docker >/dev/null 2>&1 || missing="$missing docker"
          docker compose version >/dev/null 2>&1 || missing="$missing compose"

          if [ -n "$missing" ]; then
            if ! $SUDO true 2>/dev/null; then
              echo "не хватает:$missing и нет sudo без пароля — установить не смогу" >&2
              exit 1
            fi
            echo "не хватает:$missing — устанавливаю"
            $SUDO apt-get update -qq
            $SUDO apt-get install -y -qq ca-certificates curl git docker.io
            $SUDO apt-get install -y -qq docker-compose-v2 \
              || $SUDO apt-get install -y -qq docker-compose-plugin \
              || $SUDO apt-get install -y -qq docker-compose
            $SUDO systemctl enable --now docker >/dev/null 2>&1 || true
            $SUDO usermod -aG docker "$(id -un)" >/dev/null 2>&1 || true
          else
            echo "зависимости на месте, sudo не нужен"
          fi

          # docker без sudo; если группу docker выдали только что — через sudo
          if docker info >/dev/null 2>&1; then
            COMPOSE="docker compose"
            DOCKER="docker"
          else
            COMPOSE="sudo -n docker compose"
            DOCKER="sudo -n docker"
          fi

          cd "$DEPLOY_PATH"

          if [ ! -f infra/.env ]; then
            echo "нет infra/.env — создайте один раз: cp infra/.env.example infra/.env && chmod 600 infra/.env" >&2
            exit 1
          fi

          # ── GHCR: приватные пакеты ───────────────────────────────────────
          if [ -n "$GHCR_TOKEN" ]; then
            printf '%s' "$GHCR_TOKEN" | $DOCKER login ghcr.io -u "$GHCR_USER" --password-stdin >/dev/null
            echo "ghcr.io: логин выполнен"
          else
            echo "GHCR_TOKEN не задан — считаю, что пакеты публичные или логин уже сделан"
          fi

          # ── код ──────────────────────────────────────────────────────────
          git fetch --quiet origin
          git reset --hard --quiet "$REV"
          echo "код на $(git rev-parse --short HEAD)"

          # ── режим web: HTTP или HTTPS ─────────────────────────────────────
          # флаг ставит ./infra/prod-up.sh --tls; без него деплой пересоздал бы
          # web без TLS-оверрайда — 443 исчез бы, а сайт молча ушёл на HTTP
          env_get() { grep -E "^$1=" infra/.env | tail -1 | cut -d= -f2- || true; }
          web_port="$(env_get WEB_PORT)"
          app_host="$(env_get APP_HOST)"
          app_host="${app_host:-localhost}"
          tls_enabled="$(env_get TLS_ENABLED)"
          COMPOSE_FILES="-f infra/docker-compose.prod.yml"
          if [ "$tls_enabled" = "1" ]; then
            COMPOSE_FILES="$COMPOSE_FILES -f infra/docker-compose.tls.yml"
            BASE="https://${app_host}"
            CURL="curl -fsS -k --resolve ${app_host}:443:127.0.0.1"
          else
            BASE="http://127.0.0.1:${web_port:-80}"
            CURL="curl -fsS"
          fi
          echo "режим: $( [ "$tls_enabled" = "1" ] && echo 'HTTPS (TLS_ENABLED=1)' || echo 'HTTP' )"

          PREVIOUS=""
          [ -f infra/.deployed_tag ] && PREVIOUS="$(cat infra/.deployed_tag)"

          smoke() {
            expected="${1:-}"
            test "$($CURL -o /dev/null -w '%{http_code}' "$BASE/")" = "200" || return 1
            health="$($CURL "$BASE/api/health")" || return 1
            echo "$health"
            printf '%s' "$health" | grep -q '"environment":"Production"' || return 1
            test "$($CURL -o /dev/null -w '%{http_code}' "$BASE/mock/api/health")" = "404" || return 1
            if [ -n "$expected" ]; then
              printf '%s' "$health" | grep -q "$expected" || return 1
            fi
            return 0
          }

          deploy_tag() {
            export IMAGE_TAG="$1"
            # certbot нужен в TLS-режиме: без него после рестарта стека нет
            # продления сертификата, и через ~6 дней сайт упадёт по TLS
            pull_list="api web"
            if [ "$tls_enabled" = "1" ]; then pull_list="$pull_list certbot"; fi
            set -- $pull_list
            $COMPOSE $COMPOSE_FILES --env-file infra/.env pull "$@"
            # в TLS-режиме COMPOSE_FILES тянет tls.yml: certbot остаётся в стеке
            # и продолжает продление, 443 не пропадает
            $COMPOSE $COMPOSE_FILES --env-file infra/.env \
              up -d --remove-orphans --wait --wait-timeout 120
          }

          if deploy_tag "$TAG" && smoke "${TAG#sha-}"; then
            printf '%s\n' "$TAG" > infra/.deployed_tag
            printf '%s\n' "$PREVIOUS" > infra/.previous_tag
            echo "задеплоено: $TAG (предыдущий: ${PREVIOUS:-нет})"
            echo "**DEPLOYED** — vps · \`$TAG\`"
            exit 0
          fi

          echo "smoke после деплоя не прошёл" >&2

          if [ -n "$PREVIOUS" ] && [ "$PREVIOUS" != "$TAG" ]; then
            echo "откат на $PREVIOUS" >&2
            if deploy_tag "$PREVIOUS" && smoke ""; then
              echo "**ROLLED BACK** — vps · откат на \`$PREVIOUS\`"
              exit 1
            fi
            echo "**ROLLBACK FAILED** — откат на \`$PREVIOUS\` тоже не проходит smoke" >&2
            exit 1
          fi

          echo "**DEPLOY FAILED** — откатываться не на что (первый деплой)" >&2
          exit 1
          REMOTE

      - name: Итог
        if: always()
        run: |
          if [ -s "${GITHUB_STEP_SUMMARY:-/dev/null}" ]; then
            exit 0
          fi
          echo "**DEPLOY FAILED** — смотрите лог шага «Деплой»" >> "$GITHUB_STEP_SUMMARY"
