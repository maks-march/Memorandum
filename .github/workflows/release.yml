name: Release

# Сборка и публикация образов в GHCR. Запускается только на main и вручную:
# PR-сборками занимается CI (там образы собираются без push).
#
# Теги: sha-<7> (неизменяемый, его и деплоим) и stable (плавающий, для быстрых прогонов).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  images:
    name: image-${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: infra/api.Dockerfile
            version_arg: SOURCE_REVISION
          - name: web
            dockerfile: infra/web.Dockerfile
            version_arg: APP_VERSION

    steps:
      - uses: actions/checkout@v7

      - name: Переменные сборки
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          # имя образа в GHCR обязано быть в нижнем регистре
          echo "IMAGE_OWNER=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Логин в GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Сборка и публикация
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/memorandum-${{ matrix.name }}:sha-${{ env.SHORT_SHA }}
            ghcr.io/${{ env.IMAGE_OWNER }}/memorandum-${{ matrix.name }}:stable
          build-args: |
            ${{ matrix.version_arg }}=${{ env.SHORT_SHA }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Итог
        run: |
          {
            echo "### memorandum-${{ matrix.name }}"
            echo ""
            echo "- образ: \`ghcr.io/${IMAGE_OWNER}/memorandum-${{ matrix.name }}\`"
            echo "- теги: \`sha-${SHORT_SHA}\`, \`stable\`"
            echo "- версия в сборке: \`${SHORT_SHA}\`"
            echo "- digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
