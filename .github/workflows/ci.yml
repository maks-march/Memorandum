name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
          cache: true
          cache-dependency-path: |
            backend/**/*.csproj
            backend/NuGet.config

      - name: Restore
        run: dotnet restore backend/Memorandum.slnx

      - name: Сборка
        run: dotnet build backend/Memorandum.slnx --no-restore -c Release

      - name: Тесты
        run: >
          dotnet test backend/Memorandum.slnx
          --no-build -c Release
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=tests.trx"
          --results-directory ${{ github.workspace }}/test-results

      - name: Уязвимые зависимости
        run: >
          dotnet list backend/Memorandum.slnx package
          --vulnerable --include-transitive
          | tee vulnerable.txt
          | grep -q "has the following vulnerable packages" && exit 1 || true

      - name: Отчёт о тестах
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: test-results/*.trx
          if-no-files-found: warn
          retention-days: 7

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Установка зависимостей
        working-directory: frontend
        run: npm ci

      - name: Проверка типов и сборка
        working-directory: frontend
        run: npm run build

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.10
        with:
          args: -color

  infra:
    name: infra
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:stable \
            infra/prod-up.sh infra/reload-certs.sh

      - name: Подготовить .env
        run: cp infra/.env.example infra/.env

      - name: compose config (все профили)
        run: |
          docker compose -f infra/docker-compose.dev.yml config -q
          docker compose -f infra/docker-compose.prod.yml --env-file infra/.env config -q
          docker compose -f infra/docker-compose.prod.yml -f infra/docker-compose.tls.yml \
            --env-file infra/.env config -q
          docker compose -f infra/docker-compose.prod.yml --env-file infra/.env \
            --profile tools config -q

      - name: entrypoint certbot — синтаксис shell
        run: |
          # folded-скаляр (>) склеивает строки по-разному в зависимости от
          # отступов, и команда легко распадается на обрывки. Проверяем, что
          # итоговая строка — валидный shell.
          #
          # config намеренно печатает каждый "$" как "$$" (чтобы вывод можно
          # было передать обратно в compose), поэтому снимаем экранирование
          # перед проверкой — в контейнере скрипт получит одиночные "$".
          python3 - <<'PY' > /tmp/certbot-entrypoint.sh
          import json, subprocess, sys
          out = subprocess.check_output([
              "docker", "compose",
              "-f", "infra/docker-compose.prod.yml",
              "-f", "infra/docker-compose.tls.yml",
              "--env-file", "infra/.env",
              "config", "--format", "json",
          ])
          script = json.loads(out)["services"]["certbot"]["entrypoint"][-1]
          # байтами, чтобы кириллица в echo не зависела от локали раннера
          sys.stdout.buffer.write(script.replace("$$", "$").encode())
          PY
          sh -n /tmp/certbot-entrypoint.sh

      - name: Сборка образов (без push)
        run: |
          docker build -f infra/api.Dockerfile -t memorandum-api:ci .
          docker build -f infra/web.Dockerfile -t memorandum-web:ci .

      - name: api-образ отвечает на health в прод-конфиге
        run: |
          set -eu
          docker run -d --name api-ci -p 18080:8080 \
            -e AllowedHosts=localhost \
            -e Database__Provider=Postgres \
            -e ConnectionStrings__Postgres="Host=db;Port=5432;Database=x;Username=u;Password=p" \
            -e Proxy__TrustedNetworks__0=172.16.0.0/12 \
            memorandum-api:ci

          for i in $(seq 1 30); do
            if curl -fsS -m 2 -o /dev/null http://localhost:18080/api/health; then
              echo "health ответил за $((i * 2)) с"
              break
            fi
            sleep 2
          done

          body="$(curl -fsS http://localhost:18080/api/health)"
          echo "$body"
          echo "$body" | grep -q '"environment":"Production"'
          docker rm -f api-ci

      - name: api-образ без AllowedHosts падает (fail-fast на артефакте)
        run: |
          set -eu
          if docker run --name api-nohosts \
               -e Database__Provider=Postgres \
               -e ConnectionStrings__Postgres="Host=db;Port=5432;Database=x;Username=u;Password=p" \
               -e Proxy__TrustedNetworks__0=172.16.0.0/12 \
               memorandum-api:ci; then
            echo "контейнер стартовал без AllowedHosts — fail-fast не работает"
            docker rm -f api-nohosts || true
            exit 1
          fi
          docker rm -f api-nohosts || true
          echo "контейнер завершился с ошибкой, как и требовалось"


      - name: nginx -t (HTTP и TLS-шаблон)
        run: |
          # В TLS-режиме default.conf.template целиком подменяется на nginx/tls/default.conf.template
          # (docker-compose.tls.yml) — проверяем оба состояния по очереди.
          # HTTPS_PORT тоже подставляется envsubst (попадает в редирект 80 → 443).
          docker run --rm --add-host api:127.0.0.1 -v "$PWD/infra/nginx:/tpl:ro" nginx:1.29-alpine \
            sh -c 'apk add --no-cache gettext openssl >/dev/null &&
                   export APP_HOST=localhost HTTPS_PORT=443 &&
                   cp -r /tpl/snippets /etc/nginx/snippets &&
                   envsubst "\$APP_HOST \$HTTPS_PORT" < /tpl/default.conf.template > /etc/nginx/conf.d/default.conf &&
                   nginx -t &&
                   mkdir -p /etc/letsencrypt/live/localhost /var/www/certbot &&
                   openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=localhost" \
                     -keyout /etc/letsencrypt/live/localhost/privkey.pem \
                     -out /etc/letsencrypt/live/localhost/fullchain.pem &&
                   echo "--- TLS-шаблон ---" &&
                   envsubst "\$APP_HOST \$HTTPS_PORT" < /tpl/tls/default.conf.template > /etc/nginx/conf.d/default.conf &&
                   nginx -t'

  smoke:
    name: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: up
        run: |
          cp infra/.env.example infra/.env
          docker compose -f infra/docker-compose.prod.yml --env-file infra/.env up -d --build

      - name: Ждать /api/health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS -m 3 -o /dev/null http://localhost/api/health; then
              echo "api поднялся за $((i * 3)) с"
              exit 0
            fi
            sleep 3
          done
          echo "api не ответил за 180 с"
          exit 1

      - name: Контракт
        run: |
          set -eux
          # версия — сегмент URL
          curl -fsS http://localhost/api/v1/system/info | tee /dev/stderr | grep -q '"apiVersions"'
          # путь без сегмента версии не маршрутизируется
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/api/system/info)" = "404"
          # чужой X-Api-Version игнорируется — health остаётся 200
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Api-Version: 9.9' http://localhost/api/health)" = "200"
          # в проде окружение Production, mock запрещён, версия сборки не пустая
          health="$(curl -fsS http://localhost/api/health)"
          echo "$health"
          echo "$health" | grep -q '"environment":"Production"'
          echo "$health" | grep -q '"version":"[^"]'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/mock/api/health)" = "404"

      - name: Security-заголовки на HTML и ассетах
        run: |
          set -eu
          check() {
            curl -sI "$1" | tr -d '\r' | grep -qi "$2" || { echo "нет $2 на $1"; exit 1; }
          }
          check http://localhost/ 'x-content-type-options: nosniff'
          check http://localhost/ 'content-security-policy:'
          asset=$(curl -s http://localhost/ | grep -o '/assets/[^"]*\.js' | head -1)
          echo "ассет: $asset"
          check "http://localhost$asset" 'x-content-type-options: nosniff'
          check "http://localhost$asset" 'content-security-policy:'

      - name: Логи при падении
        if: failure()
        run: docker compose -f infra/docker-compose.prod.yml logs --tail 80

      - name: down
        if: always()
        run: docker compose -f infra/docker-compose.prod.yml --env-file infra/.env down -v --remove-orphans

  # TLS-стек проверяем отдельно: он стартует только при наличии сертификата,
  # поэтому подкладываем самоподписанный в том (certbot на CI не сходим в LE).
  tls:
    name: tls
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      COMPOSE_FILES: -f infra/docker-compose.prod.yml -f infra/docker-compose.tls.yml

    steps:
      - uses: actions/checkout@v4

      - name: Подложить самоподписанный сертификат
        run: |
          cp infra/.env.example infra/.env
          # том certs создаётся compose; пишем в него через сервис certbot,
          # у которого он смонтирован на запись
          docker compose $COMPOSE_FILES --env-file infra/.env run --rm --no-deps \
            --entrypoint sh certbot -c '
            apk add --no-cache openssl >/dev/null &&
            mkdir -p /etc/letsencrypt/live/localhost &&
            openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=localhost" \
              -keyout /etc/letsencrypt/live/localhost/privkey.pem \
              -out /etc/letsencrypt/live/localhost/fullchain.pem'

      - name: up (TLS)
        run: |
          docker compose $COMPOSE_FILES --env-file infra/.env \
            up -d --build --wait --wait-timeout 240

      - name: Проверки TLS
        run: |
          set -eux

          # редирект — только на канонический хост и порт из конфига
          location="$(curl -s -o /dev/null -w '%{redirect_url}' -H 'Host: localhost' http://127.0.0.1/)"
          test "$location" = "https://localhost:443/"

          # чужой Host не получает 301: иначе это open redirect
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example' http://127.0.0.1/ || true)" != "301"

          # healthcheck-ручка работает по HTTP (так её пробует docker)
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1/healthz)" = "200"

          # HTTPS: статика, HSTS, health, mock закрыт
          curl -fsSk --resolve localhost:443:127.0.0.1 -o /dev/null https://localhost/
          curl -sIk --resolve localhost:443:127.0.0.1 https://localhost/ | tr -d '\r' | grep -qi 'strict-transport-security'
          curl -fsSk --resolve localhost:443:127.0.0.1 https://localhost/api/health | grep -q '"environment":"Production"'
          test "$(curl -s -k --resolve localhost:443:127.0.0.1 -o /dev/null -w '%{http_code}' https://localhost/mock/api/health)" = "404"

          # /scalar проксируется в API, а не в SPA; при выключенном OpenAPI — 404
          test "$(curl -s -k --resolve localhost:443:127.0.0.1 -o /dev/null -w '%{http_code}' https://localhost/scalar/v1)" = "404"

      - name: Логи при падении
        if: failure()
        run: docker compose $COMPOSE_FILES --env-file infra/.env logs --tail 80

      - name: down
        if: always()
        run: docker compose $COMPOSE_FILES --env-file infra/.env down -v --remove-orphans
