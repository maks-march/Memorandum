name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Redis-тесты ходят на localhost:6379 — поднимаем сервис рядом с job.
    # Без него падают RedisPasswordResetTicketStoreTests и сценарий смены пароля.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
          cache: true
          cache-dependency-path: |
            backend/**/*.csproj
            backend/NuGet.config

      - name: Restore
        run: dotnet restore backend/Memorandum.slnx

      - name: Сборка
        run: dotnet build backend/Memorandum.slnx --no-restore -c Release

      - name: Ждать Redis
        run: |
          for _ in {1..30}; do
            if docker run --rm --network host redis:7-alpine redis-cli -h 127.0.0.1 ping | grep -q PONG; then
              echo "Redis готов"
              exit 0
            fi
            sleep 1
          done
          echo "Redis не поднялся за 30 с"
          exit 1

      - name: Тесты
        env:
          REDIS: localhost:6379
        run: >
          dotnet test backend/Memorandum.slnx
          --no-build -c Release
          --logger "console;verbosity=minimal"
          --logger "trx;LogFileName=tests.trx"
          --results-directory ${{ github.workspace }}/test-results

      - name: Уязвимые зависимости
        run: >
          dotnet list backend/Memorandum.slnx package
          --vulnerable --include-transitive
          | tee vulnerable.txt
          | grep -q "has the following vulnerable packages" && exit 1 || true

      - name: Отчёт о тестах
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: test-results/*.trx
          if-no-files-found: warn
          retention-days: 7

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Установка зависимостей
        working-directory: frontend
        run: npm ci

      - name: Проверка типов и сборка
        working-directory: frontend
        run: npm run build

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.10
        with:
          args: -color

  infra:
    name: infra
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:stable \
            infra/prod-up.sh

      - name: Подготовить .env
        run: cp infra/.env.example infra/.env

      - name: compose config (все профили)
        run: |
          docker compose -f infra/docker-compose.dev.yml config -q
          docker compose -f infra/docker-compose.prod.yml --env-file infra/.env config -q

      - name: Сборка образов (без push)
        run: |
          docker build -f infra/api.Dockerfile -t memorandum-api:ci .
          docker build -f infra/web.Dockerfile -t memorandum-web:ci .

      # Приложение на старте применяет миграции, то есть ходит в Postgres.
      # Поэтому образ проверяем в compose-стеке (профиль ci), а не отдельным
      # docker run: там есть и db, и redis, и та же сеть, что в прод-стеке.
      - name: Запустить api-образ в прод-конфиге
        run: |
          set -eu
          # Имя контейнера фиксированное: подчищаем возможный остаток от прошлого
          # прогона, иначе docker откажется создавать api-ci.
          docker rm -f api-ci >/dev/null 2>&1 || true

          docker compose -f infra/docker-compose.prod.yml --env-file infra/.env \
            up -d db redis
          API_IMAGE=memorandum-api IMAGE_TAG=ci \
            docker compose -f infra/docker-compose.prod.yml --env-file infra/.env \
            run --rm -d --name api-ci --service-ports api-ci

      - name: api-ответ отвечает на health
        id: health
        run: |
          set -eu
          up=0
          for i in $(seq 1 30); do
            if curl -fsS -m 2 -o /dev/null http://localhost:18080/api/health; then
              echo "health ответил за $((i * 2)) с"
              up=1
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' api-ci 2>/dev/null || echo false)" != "true" ]; then
              echo "контейнер api-ci завершился на старте:"
              docker logs api-ci || true
              exit 1
            fi
            sleep 2
          done

          if [ "$up" -ne 1 ]; then
            echo "health не ответил за 60 с:"
            docker logs api-ci || true
            exit 1
          fi

          body="$(curl -fsS http://localhost:18080/api/health)"
          echo "$body"
          echo "$body" | grep -q '"environment":"Production"'
          docker rm -f api-ci

      - name: api-образ без AllowedHosts падает (fail-fast на артефакте)
        run: |
          set -eu
          if API_IMAGE=memorandum-api IMAGE_TAG=ci \
             docker compose -f infra/docker-compose.prod.yml --env-file infra/.env \
               run --rm --no-deps -e AllowedHosts="" api-ci; then
            echo "контейнер стартовал без AllowedHosts — fail-fast не работает"
            exit 1
          fi
          echo "контейнер завершился с ошибкой, как и требовалось"

      - name: api-образ без PasswordReset__CodePepper падает
        run: |
          set -eu
          if API_IMAGE=memorandum-api IMAGE_TAG=ci \
             docker compose -f infra/docker-compose.prod.yml --env-file infra/.env \
               run --rm --no-deps -e PasswordReset__CodePepper="" api-ci; then
            echo "контейнер стартовал без соли кодов — fail-fast не работает"
            exit 1
          fi
          echo "контейнер завершился с ошибкой, как и требовалось"

      - name: Убрать контейнеры инфраструктуры
        if: always()
        run: |
          docker rm -f api-ci || true
          docker compose -f infra/docker-compose.prod.yml --env-file infra/.env \
            down -v --remove-orphans || true

      - name: nginx -t (HTTP-шаблон)
        run: |
          docker run --rm --add-host api:127.0.0.1 -v "$PWD/infra/nginx:/tpl:ro" nginx:1.29-alpine \
            sh -c 'apk add --no-cache gettext >/dev/null &&
                   export APP_HOST=localhost &&
                   cp -r /tpl/snippets /etc/nginx/snippets &&
                   envsubst "\$APP_HOST" < /tpl/default.conf.template > /etc/nginx/conf.d/default.conf &&
                   nginx -t'

  smoke:
    name: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Сборка образов
        run: |
          docker build -f infra/api.Dockerfile --build-arg SOURCE_REVISION="${GITHUB_SHA::7}" \
            -t memorandum-api:ci .
          docker build -f infra/web.Dockerfile --build-arg APP_VERSION="${GITHUB_SHA::7}" \
            -t memorandum-web:ci .

      - name: up
        run: |
          cp infra/.env.example infra/.env
          # образы локальные: подменяем имена/тег переменными окружения.
          # Переменные shell важнее infra/.env — compose берёт их первыми.
          export API_IMAGE=memorandum-api WEB_IMAGE=memorandum-web IMAGE_TAG=ci
          docker compose -f infra/docker-compose.prod.yml --env-file infra/.env up -d

      - name: Ждать /api/health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS -m 3 -o /dev/null http://localhost/api/health; then
              echo "api поднялся за $((i * 3)) с"
              exit 0
            fi
            sleep 3
          done
          echo "api не ответил за 180 с"
          exit 1

      - name: Контракт
        run: |
          set -eux
          # версия — сегмент URL
          curl -fsS http://localhost/api/v1/system/info | tee /dev/stderr | grep -q '"apiVersions"'
          # путь без сегмента версии не маршрутизируется
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/api/system/info)" = "404"
          # чужой X-Api-Version игнорируется — health остаётся 200
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Api-Version: 9.9' http://localhost/api/health)" = "200"
          # в проде окружение Production, mock запрещён, версия сборки не пустая
          health="$(curl -fsS http://localhost/api/health)"
          echo "$health"
          echo "$health" | grep -q '"environment":"Production"'
          echo "$health" | grep -q '"version":"[^"]'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/mock/api/health)" = "404"

      - name: Security-заголовки на HTML и ассетах
        run: |
          set -eu
          check() {
            curl -sI "$1" | tr -d '\r' | grep -qi "$2" || { echo "нет $2 на $1"; exit 1; }
          }
          check http://localhost/ 'x-content-type-options: nosniff'
          check http://localhost/ 'content-security-policy:'
          asset=$(curl -s http://localhost/ | grep -o '/assets/[^"]*\.js' | head -1)
          echo "ассет: $asset"
          check "http://localhost$asset" 'x-content-type-options: nosniff'
          check "http://localhost$asset" 'content-security-policy:'

      - name: Логи при падении
        if: failure()
        run: docker compose -f infra/docker-compose.prod.yml logs --tail 80

      - name: down
        if: always()
        run: docker compose -f infra/docker-compose.prod.yml --env-file infra/.env down -v --remove-orphans
