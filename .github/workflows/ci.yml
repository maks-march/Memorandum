name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  backend:
    name: backend — build + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: .NET SDK (версия из global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json

      - name: Кэш NuGet
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj', 'backend/NuGet.config', 'backend/global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore backend/Memorandum.slnx

      - name: Сборка
        run: dotnet build backend/Memorandum.slnx --no-restore -c Release -warnaserror

      - name: Тесты
        run: >
          dotnet test backend/Memorandum.slnx
          --no-build -c Release
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=tests.trx"
          --results-directory ${{ github.workspace }}/test-results

      - name: Отчёт о тестах (артефакт)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: test-results/*.trx
          if-no-files-found: warn
          retention-days: 7

  frontend:
    name: frontend — typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Установка зависимостей
        working-directory: frontend
        run: npm ci

      - name: Проверка типов
        working-directory: frontend
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Сборка
        working-directory: frontend
        run: npm run build

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.10
        with:
          args: -color

  compose:
    name: compose + dockerfile
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Подготовить .env для прода (секреты фиктивные)
        run: cp infra/.env.example infra/.env

      - name: Проверить оба compose-файла
        run: |
          docker compose -f infra/docker-compose.dev.yml config -q
          docker compose -f infra/docker-compose.prod.yml --env-file infra/.env config -q
          echo "оба compose валидны"

      - name: Синтаксис shell-скриптов
        run: |
          bash -n infra/prod-up.sh
          echo "prod-up.sh — синтаксис ok"
