# ─────────────────────────────────────────────────────────────────────────────
#  TLS поверх прод-стека. Подключается и скриптом, и CD по флагу TLS_ENABLED=1
#  в infra/.env — это единственный источник истины, иначе деплой по кнопке
#  молча пересоздаст web без TLS и сайт уйдёт на HTTP.
#
#    docker compose -f infra/docker-compose.prod.yml \
#                   -f infra/docker-compose.tls.yml --env-file infra/.env up -d
#
#  Что добавляет: порт 443, сертификаты, конфиг nginx с редиректом 80 → 443
#  и /healthz, а также сервис certbot.
# ─────────────────────────────────────────────────────────────────────────────

services:
  web:
    ports:
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # сертификаты и ACME-каталог нужны только в TLS-режиме
      - certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
      # заменяем HTTP-конфиг на вариант с редиректом и HTTPS-блоком
      - ./nginx/tls/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    environment:
      # попадает в редирект 80 → 443: https://APP_HOST:HTTPS_PORT
      HTTPS_PORT: ${HTTPS_PORT:-443}
    healthcheck:
      # после редиректа GET / отдаёт 301 — проверяем техническую ручку
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  certbot:
    # пин по тегу: latest меняется молча и ломает выпуск
    image: certbot/certbot:v5.8.0
    restart: unless-stopped
    volumes:
      - certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    environment:
      APP_HOST: ${APP_HOST:-localhost}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:-admin@example.ru}
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    # --deploy-hook трогает флаг: хост-cron (infra/reload-certs.sh) перезагрузит
    # nginx только когда сертификат действительно обновился.
    #
    # Все строки скрипта выровнены одинаково: в folded-скаляре (>) строка с
    # большим отступом сохраняет перевод строки, и shell получает обрывок
    # команды (`--email: not found`). Одна строка = безопасно.
    #
    # certonly повторяется, пока сертификата нет: на первом запуске web может
    # подниматься дольше, чем certbot успевает постучаться за челленджем.
    # IP определяем по «нет ничего, кроме цифр и точек»: шаблон *[0-9].[0-9]*
    # ложно срабатывает на доменах вроде app2.0.example.ru, и certbot уходит
    # в --ip-address вместо -d.
    entrypoint: >
      /bin/sh -c "
      trap exit TERM;
      case \"$$APP_HOST\" in
      *[!0-9.]*) ARGS=\"-d $$APP_HOST\"; SLEEP=12h ;;
      *) ARGS=\"--ip-address $$APP_HOST --preferred-profile shortlived\"; SLEEP=24h ;;
      esac;
      CERT=\"/etc/letsencrypt/live/$$APP_HOST/fullchain.pem\";
      i=0;
      while [ ! -f \"$$CERT\" ]; do
      i=$$((i + 1));
      if certbot certonly --webroot -w /var/www/certbot $$ARGS --email $$CERTBOT_EMAIL --agree-tos --no-eff-email -n; then
      echo \"certbot: сертификат для $$APP_HOST получен\";
      break;
      fi;
      if [ $$i -ge 60 ]; then
      echo \"certbot: сертификат не получен за 30 минут — остаётся только renew\" >&2;
      break;
      fi;
      echo \"certbot: попытка $$i не удалась, повтор через 30 с\" >&2;
      sleep 30 & wait $$!;
      done;
      while :; do
      certbot renew --webroot -w /var/www/certbot --quiet --deploy-hook 'touch /var/www/certbot/.reload';
      sleep $$SLEEP & wait $$!;
      done"
