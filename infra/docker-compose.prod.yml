# ─────────────────────────────────────────────────────────────────────────────
#  PROD: nginx (статика SPA + прокси) + api + postgres.
#  Запуск:  ./infra/prod-up.sh          (образы тянутся из GHCR)
#  Локальная сборка: docker build -f infra/api.Dockerfile -t memorandum-api:local . (см. infra/README.md)
#  Наружу:  80. HTTPS — вместе с -f infra/docker-compose.tls.yml (TLS_ENABLED=1 в infra/.env).
#  API и БД — только внутренняя сеть.
# ─────────────────────────────────────────────────────────────────────────────
name: memorandum

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-memorandum}
      POSTGRES_USER: ${POSTGRES_USER:-memorandum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в infra/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-memorandum} -d ${POSTGRES_DB:-memorandum}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    # порт наружу не публикуем — только внутри сети

  api:
    # готовый образ из GHCR — собирается в CI (Release), на сервере не собирается
    image: ${API_IMAGE:-ghcr.io/maks-march/memorandum-api}:${IMAGE_TAG:-stable}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:8080
      ConnectionStrings__Postgres: "Host=db;Port=5432;Database=${POSTGRES_DB:-memorandum};Username=${POSTGRES_USER:-memorandum};Password=${POSTGRES_PASSWORD}"
      Database__Provider: Postgres
      Mock__Enabled: "false"
      # host-фильтрация: домен + localhost (для healthcheck изнутри контейнера)
      AllowedHosts: "${APP_HOST:-localhost};localhost;127.0.0.1"
      # доверяем X-Forwarded-* только от nginx из этой docker-сети (см. networks ниже)
      Proxy__TrustedNetworks__0: "172.28.0.0/16"
    healthcheck:
      # 127.0.0.1, а не localhost: имя может резолвиться в ::1, а Kestrel слушает 0.0.0.0
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

  web:
    image: ${WEB_IMAGE:-ghcr.io/maks-march/memorandum-web}:${IMAGE_TAG:-stable}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"
    environment:
      APP_HOST: ${APP_HOST:-localhost}
    healthcheck:
      # проверяем статику: nginx не должен становиться unhealthy из-за api
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

networks:
  default:
    name: memorandum
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  pgdata:
