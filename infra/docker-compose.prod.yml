# ─────────────────────────────────────────────────────────────────────────────
#  PROD: nginx (статика SPA + прокси) + api + postgres.
#  Запуск:  ./infra/prod-up.sh          (или docker compose -f infra/docker-compose.prod.yml up -d --build)
#  Наружу:  80. HTTPS включается вручную — см. комментарий в infra/nginx/default.conf.template.
#  API и БД — только внутренняя сеть.
# ─────────────────────────────────────────────────────────────────────────────
name: memorandum

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-memorandum}
      POSTGRES_USER: ${POSTGRES_USER:-memorandum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в infra/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-memorandum} -d ${POSTGRES_DB:-memorandum}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    # порт наружу не публикуем — только внутри сети

  api:
    # Образ из GHCR (деплой на VPS). build — для локального запуска через prod-up.sh.
    image: ${API_IMAGE:-ghcr.io/maks-march/memorandum-api}:${IMAGE_TAG:-stable}
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-local}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:8080
      ConnectionStrings__Postgres: "Host=db;Port=5432;Database=${POSTGRES_DB:-memorandum};Username=${POSTGRES_USER:-memorandum};Password=${POSTGRES_PASSWORD}"
      Database__Provider: Postgres
      Mock__Enabled: "false"
      # host-фильтрация: домен + localhost (для healthcheck изнутри контейнера)
      AllowedHosts: "${APP_HOST:-localhost};localhost;127.0.0.1"
      # доверяем X-Forwarded-* только от nginx из этой docker-сети (см. networks ниже)
      Proxy__TrustedNetworks__0: "172.28.0.0/16"
    healthcheck:
      # 127.0.0.1, а не localhost: имя может резолвиться в ::1, а Kestrel слушает 0.0.0.0
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

  web:
    image: ${WEB_IMAGE:-ghcr.io/maks-march/memorandum-web}:${IMAGE_TAG:-stable}
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
      args:
        APP_VERSION: ${SOURCE_REVISION:-local}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      # сертификаты нужны, только если включён TLS (infra/docker-compose.tls.yml)
      - certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    environment:
      APP_HOST: ${APP_HOST:-localhost}
    healthcheck:
      # проверяем статику: nginx не должен становиться unhealthy из-за api
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

  # TLS: APP_HOST=<домен> docker compose -f infra/docker-compose.prod.yml --profile tls up -d
  # Выпускает и продлевает сертификат. HTTPS заработает после включения server-блока 443 + порта 443.
  certbot:
    image: certbot/certbot:latest
    profiles: ["tls"]
    restart: unless-stopped
    volumes:
      - certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    logging: *default-logging
    entrypoint: >
      /bin/sh -c "trap exit TERM;
      certbot certonly --webroot -w /var/www/certbot -d ${APP_HOST} --email ${CERTBOT_EMAIL} --agree-tos --no-eff-email -n || true;
      while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"

  # Бэкап БД: docker compose -f infra/docker-compose.prod.yml --profile tools run --rm backup
  # Поставить в cron хоста: 0 3 * * * cd /opt/memorandum && docker compose -f infra/docker-compose.prod.yml --profile tools run --rm backup
  backup:
    image: postgres:17-alpine
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-memorandum}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-memorandum}
    volumes:
      - backups:/backups
    logging: *default-logging
    entrypoint: >
      /bin/sh -c "pg_dump -Fc | gzip -9 > /backups/memorandum-$$(date +%Y%m%d-%H%M%S).dump.gz &&
      find /backups -name '*.gz' -mtime +14 -delete &&
      echo backup-ok: $$(du -h /backups | tail -1)"

networks:
  default:
    name: memorandum
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  pgdata:
  certs:
  certbot_www:
  backups:
