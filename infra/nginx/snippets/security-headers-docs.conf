# Заголовки для /scalar и /openapi (документация API). CSP мягче обычного:
# страница Scalar тянет шрифты с fonts.scalar.com. Дублировать CSP нельзя:
# при двух заголовках Content-Security-Policy браузер применяет пересечение,
# и страница перестаёт открываться.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; worker-src 'self' blob:; connect-src 'self'; font-src 'self' data: https://fonts.scalar.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
