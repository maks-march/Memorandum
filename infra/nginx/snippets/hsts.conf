# HSTS. Подключается ТОЛЬКО в HTTPS-блоке и в каждом location (add_header не
# наследуется в location, где есть свой add_header). На HTTP-блоке его быть не должно:
# браузер запомнит домен как https-only, и без валидного сертификата сайт «пропадёт».
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
