# ─────────────────────────────────────────────────────────────────────────────
#  DEV: горячая перезагрузка бэка и фронта, Postgres, Redis, всё локально.
#  Запуск:  docker compose -f infra/docker-compose.dev.yml up
#  Фронт:   http://localhost:5173      API: http://localhost:5000/scalar/v1
# ─────────────────────────────────────────────────────────────────────────────
name: memorandum-dev

services:
  api:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    working_dir: /src
    # --project tools/... : watch читает проект из tools, а не из /src/src, иначе
    # staticwebassets.development.json ищется по пути '/src/src/...'.
    command: >
      dotnet watch --project src/Memorandum.Api/Memorandum.Api.csproj run
      --no-launch-profile --urls http://0.0.0.0:5000
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_USE_POLLING_FILE_WATCHER: "1"      # надёжнее на Docker Desktop (Win/Mac)
      Database__Provider: Postgres
      ConnectionStrings__Postgres: "Host=db;Port=5432;Database=${POSTGRES_DB:-memorandum};Username=${POSTGRES_USER:-memorandum};Password=${POSTGRES_PASSWORD:-memorandum}"
      Mock__Enabled: "true"
      # коды смены пароля: Redis ниже, в этой же compose-сети
      Redis__Configuration: "redis:6379"
      # почта: письма отправляет сам API. SMTP берётся из infra/.env (как в проде);
      # пусто — письмо печатается в лог с предупреждением.
      Smtp__Host: "${SMTP_HOST:-}"
      Smtp__Port: "${SMTP_PORT:-587}"
      Smtp__UseStartTls: "${SMTP_STARTTLS:-true}"
      Smtp__User: "${SMTP_USER:-}"
      Smtp__Password: "${SMTP_PASSWORD:-}"
      Smtp__From: "${SMTP_FROM:-}"
    volumes:
      - ../backend:/src
      - nuget:/root/.nuget/packages          # быстрый restore между перезапусками
    depends_on:
      db:
        condition: service_healthy             # миграции на старте ждут готовую БД
      redis:
        condition: service_healthy
    ports:
      - "5000:5000"                          # Scalar + OpenAPI доступны снаружи контейнера
    healthcheck:
      # 127.0.0.1, а не localhost: имя может резолвиться в ::1, а Kestrel слушает 0.0.0.0
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-memorandum}
      POSTGRES_USER: ${POSTGRES_USER:-memorandum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-memorandum}
    restart: unless-stopped
    ports:
      - "5432:5432"                           # наружу нужен тестам на хосте (dotnet test)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine                     # тикеты смены пароля (TTL + Lua)
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
      - "6379:6379"  
    volumes:
      - redisdata:/data

  web:
    image: node:26-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_TARGET: http://api:5000        # Vite проксирует /api и /mock сюда
      VITE_PORT: "5173"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ../frontend:/app
      - node_modules:/app/node_modules        # не затирать хостовым node_modules
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  nuget:
  node_modules:
  pgdata:
  redisdata:
